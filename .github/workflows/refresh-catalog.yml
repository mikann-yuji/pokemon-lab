name: Refresh catalog data

on:
  schedule:
    # 03:17 UTC = 12:17 JST。毎時0分の混雑を避ける。
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scrape current catalog data
        run: npm run catalog:refresh

      - name: Validate catalog and application
        run: |
          npm run lint
          npm run build

      - name: Commit refreshed seeds
        shell: bash
        run: |
          if git diff --quiet -- database/seeds; then
            echo "Catalog seeds are unchanged."
            exit 0
          fi
          git config user.name "pokemon-lab-catalog-bot"
          git config user.email "pokemon-lab-catalog-bot@users.noreply.github.com"
          git add database/seeds
          git commit -m "Refresh catalog data"
          git push origin HEAD:master
